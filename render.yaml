services:
  - type: web
    name: freshfold-laundry
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci && npm run build --workspace client
    startCommand: npm run start --workspace server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: VITE_API_URL
        value: /api
      - key: CLIENT_ORIGIN
        fromService:
          name: freshfold-laundry
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
